<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Justice &amp; Associates</title>
  <desc id="logoDesc">Law firm logo with scales of justice and wordmark</desc>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b23a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <!-- Scales of justice mark -->
  <g fill="url(#goldGrad)" stroke="#c9a227" stroke-width="0.6">
    <rect x="26" y="6" width="3" height="34" rx="1"/>
    <rect x="10" y="12" width="36" height="2.5" rx="1"/>
    <path d="M10 14.5 L6 20 Q4 24 8 24 L14 24 Q18 24 16 20 Z"/>
    <path d="M46 14.5 L50 20 Q52 24 48 24 L42 24 Q38 24 40 20 Z"/>
    <line x1="10" y1="14.5" x2="6" y2="20" stroke="#c9a227" stroke-width="1.2" fill="none"/>
    <line x1="46" y1="14.5" x2="50" y2="20" stroke="#c9a227" stroke-width="1.2" fill="none"/>
    <circle cx="28" cy="42" r="3" fill="#c9a227"/>
  </g>
  <!-- Bracket accent -->
  <text x="58" y="22" fill="#c9a227" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">[</text>
  <!-- Wordmark -->
  <text x="72" y="26" fill="#e8e8e8" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" letter-spacing="0.04em">JUSTICE</text>
  <text x="72" y="44" fill="#a0a0a8" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="0.12em">&amp; ASSOCIATES</text>
  <text x="298" y="22" fill="#c9a227" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">]</text>
  <!-- Botswana tagline line -->
  <line x1="72" y1="50" x2="220" y2="50" stroke="#4a4a55" stroke-width="1"/>
</svg>
